services:
  node:
    image: node:11.4.0
    user: node
    ports:
      - "8080:8080"
      - "9229:9229"
    environment:
      DATABASE_URL: "postgres://emerald-city-resource-guide:password@postgres:5432/emerald-city-resource-guide"
      PGSSLMODE: disable
      FIREBASE_CONFIG:
      GOOGLE_CONFIG:
    working_dir: /code
    volumes:
      - .:/code
    depends_on:
      postgres:
        condition: service_healthy
    command: npm start

  postgres:
    image: postgres:14.2
    environment:
      POSTGRES_USER: emerald-city-resource-guide
      POSTGRES_PASSWORD: password
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "emerald-city-resource-guide"]
      interval: 1s
      retries: 30
